{% extends "base.html" %}

{% block content %}

<h1>{{ article.title }}</h1>

<p>{{ article.content }}</p>

<hr>

<img src="url_for('static' filename='Assets/articleThumbs/' ~ article.image_filename ~ '.jpg')">

<p><strong>Tags:</strong> {{ article.tags }}</p>

<a href="{{ url_for('article_edit', id=article.articleID) }}" class="btn btn-primary mt-3">
    Edit Article
</a>

{% endblock %}
