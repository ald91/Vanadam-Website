{% extends "base.html" %}
{% block content %}

<h1>{{ post.title }}</h1>
<p><strong>Posted by:</strong> {{ post.username }}</p>
<p>{{ post.content }}</p>

<hr>

<h3>Comments</h3>

{% for msg in messages %}
    <div class="comment">
        <strong>{{ msg.username }}</strong>: {{ msg.content }}
    </div>
{% else %}
    <p>No comments yet.</p>
{% endfor %}

<hr>

{% include "comment_form.html" %}

{% endblock %}
