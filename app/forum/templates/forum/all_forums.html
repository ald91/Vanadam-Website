{% extends "base.html" %}
{% block content %}
<h1>Looking For Group</h1>

<a href="{{ url_for('forum.post_create') }}">Create New Post</a>

<hr>

<div id="posts">
    {% for post in posts %}
        <div class="post">
            <h3><a href="{{ url_for('forum.view_post', id=post.id) }}">{{ post.title }}</a></h3>
            <p>{{ post.summary }}</p>
        </div>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}
</div>

{% endblock %}
