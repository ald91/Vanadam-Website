{% extends "base.html" %}
{% block content %}
<h1>Looking For Group</h1>

<a href="{{ url_for('forum.create_post') }}">Create New Post</a>

<hr>

<div id="posts">
    {% for post in posts %}
        <div class="post">
            <h3>
                <a href="{{ url_for('forum.view_post', id=post['forumID']) }}">
                    {{ post['title'] }}
                </a>
            </h3>
            <p>{{ post['content'][:200] }}...</p>
        </div>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}
</div>

{% endblock %}
